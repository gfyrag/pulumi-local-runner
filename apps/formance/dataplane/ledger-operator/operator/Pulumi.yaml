name: ledger-operator
runtime:
  name: go
  options:
    buildTarget: ./bin/pulumi
description: Ledger operator deployment (CRDs, operator)
x-plr-config:
  source-repo:
    type: string
    default: "git@github.com:formancehq/ledger-v3-poc.git"
    description: Git URL or local path of the operator source repository
  source-ref:
    type: string
    description: Git ref (branch, tag, commit) to checkout from source-repo
  k8s-context:
    type: string
    required: true
    description: Kubernetes context to use
  namespace:
    type: string
    description: Kubernetes namespace (defaults to stack name)
  watchNamespace:
    type: string
    description: Namespace the operator watches (defaults to the deployment namespace)

  registry:
    type: string
    default: ghcr.io
    description: Docker registry for building images
  pull-registry:
    type: string
    description: Docker registry for pulling images (defaults to registry)
  docker-builder-name:
    type: string
    description: Docker buildx builder name
  imageTag:
    type: string
    description: Image tag (defaults to git version)
  arch:
    type: string
    default: amd64
    description: Target CPU architecture
  registry-username:
    type: string
    secret: true
    description: Docker registry username
  registry-password:
    type: string
    secret: true
    description: Docker registry password

  image-pull-policy:
    type: string
    default: IfNotPresent
    description: imagePullPolicy for the operator container (Always | IfNotPresent | Never)
  image-pull-secrets:
    type: array
    description: List of image pull secret references
    items:
      type: object
      properties:
        name:
          type: string
          description: Name of the K8s docker-registry secret

  replicaCount:
    type: integer
    default: 1
    description: Number of operator replicas
  leaderElection:
    type: boolean
    default: true
    description: Enable Kubernetes leader election for the operator

  resources:
    type: object
    description: Compute resources for the operator pod
    properties:
      requests:
        type: object
        properties:
          cpu:
            type: string
          memory:
            type: string
      limits:
        type: object
        properties:
          cpu:
            type: string
          memory:
            type: string

  serviceAccount:
    type: object
    description: Operator service account configuration
    properties:
      create:
        type: boolean
        description: Whether the chart should create the service account
      name:
        type: string
        description: Override the service account name
      annotations:
        type: object
        description: Annotations applied to the service account (e.g. eks.amazonaws.com/role-arn for IRSA)

  node-selector:
    type: object
    description: "Node selector for the operator pod (e.g. {topology.kubernetes.io/zone: eu-west-1c})"
  tolerations:
    type: array
    description: Tolerations for the operator pod
    items:
      type: object
      properties:
        key:
          type: string
        operator:
          type: string
        value:
          type: string
        effect:
          type: string
        tolerationSeconds:
          type: integer

  pvcProtection:
    type: object
    description: Volume deletion protection (ValidatingAdmissionPolicy on ledger PVCs/PVs, requires k8s >= 1.30)
    properties:
      enabled:
        type: boolean
        description: Install the admission policy that blocks unauthorized PVC/PV deletion
      allowDeletionAnnotation:
        type: string
        description: Annotation that, when present, allows deletion (default formance.com/allow-deletion)

  ledger-image-registry:
    type: string
    description: Docker registry for ledger image (defaults to pull-registry)
  ledger-image-name:
    type: string
    default: formancehq/ledger
    description: Ledger image name
  ledger-image-tag:
    type: string
    default: latest
    description: Ledger image tag

  coldStorage-iam-role-arn:
    type: string
    description: AWS IAM role ARN for cold storage IRSA (creates a separate aws-access service account)
  coldStorage-s3-bucket:
    type: string
    description: S3 bucket name for cold storage
  coldStorage-s3-region:
    type: string
    default: eu-west-1
    description: AWS region for S3 cold storage
