name: nats
runtime:
  name: go
  options:
    buildTarget: ./bin/pulumi
description: NATS Operator for Kubernetes
x-plr-config:
  k8s-context:
    type: string
    required: true
    description: Kubernetes context to use
  namespace:
    type: string
    description: Kubernetes namespace (defaults to stack name)
  nats:
    type: object
    description: NATS Helm chart values
    properties:
      config:
        type: object
        description: NATS server configuration
        properties:
          cluster:
            type: object
            description: Cluster configuration
          jetstream:
            type: object
            description: JetStream configuration
      container:
        type: object
        description: Container configuration
        properties:
          image:
            type: object
            description: Image configuration
          resources:
            type: object
            description: Resource limits/requests
