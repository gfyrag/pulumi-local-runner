name: nats
runtime:
  name: go
  options:
    buildTarget: ./bin/pulumi
description: NATS Operator for Kubernetes
schema:
  k8s-context:
    type: string
    required: true
    description: Kubernetes context to use
  namespace:
    type: string
    description: Kubernetes namespace (defaults to stack name)
  config:
    type: object
    description: NATS server configuration (Helm chart values under config)
    properties:
      cluster:
        type: object
        description: Cluster configuration
      jetstream:
        type: object
        description: JetStream configuration
  container:
    type: object
    description: Container configuration (Helm chart values under container)
    properties:
      image:
        type: object
        description: Image configuration
      resources:
        type: object
        description: Resource limits/requests
