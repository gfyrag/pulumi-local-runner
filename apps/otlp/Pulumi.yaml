  Ok, déplace toute les apps de monitoring dans ~/Work/Perso/Projects/pulumi-local-runner/apps.
  Met a jour la config plr.name: otlp
runtime:
  name: go
  options:
    buildTarget: ./bin/pulumi
description: OpenTelemetry Collector
x-plr-config:
  k8s-context:
    type: string
    required: true
    description: Kubernetes context to use
  namespace:
    type: string
    description: Kubernetes namespace (defaults to stack name)
  otlp:
    type: object
    description: OpenTelemetry Collector Helm chart values
    properties:
      config:
        type: object
        description: Collector configuration (receivers, processors, exporters, pipelines)
      image:
        type: object
        properties:
          repository: {type: string}
      mode: {type: string, description: "Deployment mode (deployment, daemonset, statefulset)"}
      ports:
        type: object
        description: Port configuration
