name: tempo
runtime:
  name: go
  options:
    buildTarget: ./bin/pulumi
description: Tempo distributed tracing backend
schema:
  k8s-context:
    type: string
    required: true
    description: Kubernetes context to use
  namespace:
    type: string
    description: Kubernetes namespace (defaults to stack name)
  tempo:
    type: object
    description: Tempo Helm chart values
    properties:
      persistence:
        type: object
        properties:
          enabled: {type: boolean}
          size: {type: string}
      service:
        type: object
        properties:
          type: {type: string}
      tempo:
        type: object
        description: Tempo storage configuration
      traces:
        type: object
        description: Trace receiver configuration
